    </p>

<script>
  (() => {
    // Subtle educational delight: long-press / double-tap to inspect resource origin for students
    const textEl = document.getElementById('greeting_message');
    if (!textEl) return;

    let clickCount = 0;
    let timer = null;

    textEl.addEventListener('click', () => {
      clickCount++;
      if (clickCount === 1) {
        timer = setTimeout(() => {
          clickCount = 0;
        }, 350);
      } else if (clickCount === 2) {
        clearTimeout(timer);
        clickCount = 0;
        
        // Gentle haptic-style visual pulse demonstrating standard Android View interaction
        textEl.style.transition = 'opacity 0.2s ease, transform 0.2s ease';
        textEl.style.opacity = '0.4';
        textEl.style.transform = 'scale(0.97)';
        
        setTimeout(() => {
          textEl.style.opacity = '1';
          textEl.style.transform = 'scale(1)';
        }, 200);
      }
    });
  })();
</script></main><div class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface/90 backdrop-blur-xl shadow-[0_-1px_8px_rgba(0,0,0,0.02)] select-none pointer-events-none" style="background-color: rgba(254, 247, 255, 0.9);"><div class="h-6 flex items-center justify-center"><div class="w-24 h-1 rounded-full bg-on-surface/40" style="background-color: rgba(29, 27, 32, 0.4);"></div></div></div>
