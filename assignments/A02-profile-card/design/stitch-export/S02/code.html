<script>
  // Micro-interaction: Provide tactile feedback when pressing the greeting button again
  const button = document.getElementById('greetButton');
  const greetingContainer = document.getElementById('greetingContainer');
  const greetingText = document.getElementById('greetingText');

  if (button && greetingContainer && greetingText) {
    button.addEventListener('click', () => {
      // Subtle pulse / highlight animation
      greetingContainer.classList.add('bg-secondary-fixed');
      greetingContainer.classList.add('scale-[1.02]');
      
      setTimeout(() => {
        greetingContainer.classList.remove('scale-[1.02]');
        greetingContainer.classList.remove('bg-secondary-fixed');
      }, 250);
    });
  }
</script></main><footer class="fixed bottom-0 w-full z-50 pb-safe bg-surface/80 backdrop-blur-xl pointer-events-none select-none"><div class="h-12 w-full flex items-center justify-center pointer-events-auto"><div class="w-32 h-1 bg-on-surface/30 rounded-full"></div></div></footer>
