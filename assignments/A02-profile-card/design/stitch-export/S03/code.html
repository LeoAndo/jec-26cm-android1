<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#fef7ff;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{colors:{"primary-fixed-dim":"#cfbdff","surface-container":"#f2ecf3","surface-container-low":"#f8f2f9","surface-container-highest":"#e6e1e8","on-tertiary-fixed-variant":"#633b48","surface-container-high":"#ece6ed","on-surface-variant":"#494551","on-primary-fixed-variant":"#4e388a","tertiary":"#633b48","surface-bright":"#fef7ff","on-surface":"#1d1b20","inverse-surface":"#322f35","surface-dim":"#ded8df","error":"#ba1a1a","tertiary-container":"#7d5260","outline-variant":"#cac4d2","secondary-fixed":"#e8def9","secondary-container":"#e8def9","surface-container-lowest":"#ffffff","on-primary":"#ffffff","on-error":"#ffffff","on-secondary-fixed":"#1e192b","tertiary-fixed":"#ffd9e3","on-tertiary":"#ffffff","surface":"#fef7ff","on-secondary":"#ffffff","error-container":"#ffdad6","on-background":"#1d1b20","on-tertiary-fixed":"#31111d","on-tertiary-container":"#ffcbda","on-primary-container":"#dfd2ff","inverse-on-surface":"#f5eff6","secondary":"#625b71","background":"#fef7ff","inverse-primary":"#cfbdff","tertiary-fixed-dim":"#eeb8c8","surface-tint":"#6650a4","secondary-fixed-dim":"#ccc2dc","surface-variant":"#e6e1e8","on-primary-fixed":"#21005d","outline":"#7a7582","on-secondary-fixed-variant":"#4a4358","primary-container":"#6650a4","on-secondary-container":"#686177","on-error-container":"#93000a","primary":"#4e378a","primary-fixed":"#e8ddff"},borderRadius:{"DEFAULT":"0.2 ">wifi</span><span class="material-symbols-outlined text-[16px]">signal_cellular_alt</span><span class="material-symbols-outlined text-[16px]">battery_full</span></div></div></div><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full px-6 py-6 pb-space-xl"><h1 class="font-title-sm text-title-sm font-semibold text-on-surface-variant mb-6">自己紹介カード</h1><div class="flex items-center gap-4 flex-wrap mb-4"><div class="w-16 h-16 rounded-full overflow-hidden flex-shrink-0"><img alt="人物アイコン" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AEtjO1Xb84Rlwy0JtFhab-4ZcOm03kGNFsVLvyJXLmC3hsl3jUuXkp37R96s_oyB83oWVn7PurbRMATbY5hsc9WLQGSBVGdtQtnUQK-XmsZpU9ky7YEm3MrOSzR7qov8RngSKNMPhKmbAtEat3S_fyyQO76OTbI_v60N8rLpXwKyUtyWbBcnB8jZU1uULS3E2nR7y0-_NnCzUYyl7TxO49EoPgJHUnRPPK9la4mj1JImFnssof2BOoJsUfq2TwU"></div><div class="font-title-lg text-title-lg font-bold text-on-surface tracking-tight" id="display-name">サクラ</div></div><div class="mb-6"><p class="font-body-lg text-body-lg text-on-surface transition-all duration-200" id="greeting-message">よろしくお願いします。</p></div><div class="mb-8"><button class="h-10 px-6 rounded-full bg-primary text-on-primary font-label-lg text-label-lg font-medium active:scale-[0.98] transition-transform" id="btn-greet" type="button">あいさつする</button></div><div class="flex flex-col w-full mb-6"><label class="font-title-sm text-title-sm font-medium text-on-surface mb-2" for="name-input">名前</label><div class="relative flex items-center w-full h-14 rounded bg-surface border border-outline/40 focus-within:border-primary"><input class="w-full h-full px-4 bg-transparent text-on-surface placeholder:text-outline font-body-md text-body-md focus:outline-none" id="name-input" placeholder="例：サクラ" type="text" value=""></div></div><div class="flex flex-row w-full gap-3"><button class="flex-1 h-11 rounded-full bg-primary text-on-primary font-label-lg text-label-lg font-medium active:scale-[0.98] transition-transform" id="btn-apply" type="button">名前を反映</button><button class="flex-1 h-11 rounded-full bg-secondary-container text-on-surface font-label-lg text-label-lg font-medium active:scale-[0.98] transition-transform" id="btn-reset" type="button">リセット</button></div><div class="opacity-0 pointer-events-none transition-opacity duration-300 mt-6 self-center flex items-center gap-2 bg-inverse-surface text-inverse-on-surface px-4 py-2.5 rounded-full shadow-md" id="toast"><span class="font-body-sm text-body-sm" id="toast-text">こんにちは！</span></div></div><script>(function(){const input=document.getElementById('name-input');const nameDisplay=document.getElementById('display-name');const greetingMsg=document.getElementById('greeting-message');const btnApply=document.getElementById('btn-apply');const btnReset=document.getElementById('btn-reset');const btnGreet=document.getElementById('btn-greet');const toast=document.getElementById('toast');const toastText=document.getElementById('toast-text');let toastTimer=null;function showToast(msg){if(toastTimer)clearTimeout(toastTimer);toastText.textContent=msg;toast.classList.remove('opacity-0');toastTimer=setTimeout(()=>{toast.classList.add('opacity-0');},2200);}btnApply.addEventListener('click',()=>{const val=input.value.trim();if(val.length>0){nameDisplay.textContent=val;greetingMsg.textContent=`${val}です。よろしくお願いします！`;showToast(`名前を「${val}」に更新しました`);}else{showToast('名前を入力してください（例：サクラ）');}});btnReset.addEventListener('click',()=>{input.value='';nameDisplay.textContent='サクラ';greetingMsg.textContent='よろしくお願いします。';showToast('初期設定にリセットしました');});btnGreet.addEventListener('click',()=>{const currentName=nameDisplay.textContent;const originalText=greetingMsg.textContent;greetingMsg.textContent=`こんにちは！${currentName}です！よろしくお願いします！`;showToast(`${currentName}があいさつしました`);setTimeout(()=>{if(greetingMsg.textContent.startsWith('こんにちは！')){greetingMsg.textContent=originalText;}},3000);});})();</script></main><footer class="fixed bottom-0 w-full z-50 pb-safe bg-surface/80 backdrop-blur-xl pointer-events-none select-none"><div class="h-12 w-full flex items-center justify-center pointer-events-auto"><div class="w-32 h-1 bg-on-surface/30 rounded-full"></div></div></footer>
