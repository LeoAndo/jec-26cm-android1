ace-variant font-medium mb-6">自己紹介カード</h1><div class="flex items-center gap-4 mb-6"><div class="w-16 h-16 rounded-full overflow-hidden shrink-0"><img src="https://lh3.googleusercontent.com/aida/AEtjO1Xb84Rlwy0JtFhab-4ZcOm03kGNFsVLvyJXLmC3hsl3jUuXkp37R96s_oyB83oWVn7PurbRMATbY5hsc9WLQGSBVGdtQtnUQK-XmsZpU9ky7YEm3MrOSzR7qov8RngSKNMPhKmbAtEat3S_fyyQO76OTbI_v60N8rLpXwKyUtyWbBcnB8jZU1uULS3E2nR7y0-_NnCzUYyl7TxO49EoPgJHUnRPPK9la4mj1JImFnssof2BOoJsUfq2TwU" alt="サクラ" class="w-full h-full object-cover"></div><div class="flex-1 min-w-0"><span class="font-headline-sm text-headline-sm text-on-surface font-bold break-words">サクラ</span></div></div><p id="greetingText" class="font-body-lg text-body-lg text-on-surface mb-8 leading-relaxed break-words">よろしくお願いします。</p><button id="greetButton" type="button" class="w-full h-12 bg-primary text-on-primary font-label-lg text-label-lg font-medium rounded-full hover:bg-primary/90 active:bg-primary/80 transition-colors flex items-center justify-center cursor-pointer select-none">あいさつする</button><div id="toastNotification" class="hidden mt-4 bg-inverse-surface text-inverse-on-surface text-body-sm font-body-sm py-2 px-4 rounded-full text-center shadow-sm transition-opacity duration-200">こんにちは！仲良くしてくださいね ✨</div></div></div>
<script>
  (function() {
    const button = document.getElementById('greetButton');
    const greetingText = document.getElementById('greetingText');
    const toast = document.getElementById('toastNotification');

    const greetings = [
      'よろしくお願いします。',
      'こんにちは！今日もいい日ですね ✨',
      '素敵な一日になりますように 🎵',
      'Androidアプリ作り、楽しいですね！'
    ];
    let currentIndex = 0;

    button.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % greetings.length;
      greetingText.textContent = greetings[currentIndex];

      toast.classList.remove('hidden');
      toast.style.opacity = '1';

      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => {
          toast.classList.add('hidden');
        }, 300);
      }, 2000);
    });
  })();
</script></main><footer class="fixed bottom-0 w-full z-50 pb-safe bg-surface/80 backdrop-blur-xl pointer-events-none select-none"><div class="h-12 w-full flex items-center justify-center pointer-events-auto"><div class="w-32 h-1 bg-on-surface/30 rounded-full"></div></div></footer>
