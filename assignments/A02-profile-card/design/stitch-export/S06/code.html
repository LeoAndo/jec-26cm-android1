5rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},spacing:{"space-xl":"2rem","margin":"1rem","margin-expanded":"1.5rem","gutter-compact":"0.5rem","space-lg":"1.5rem","gutter":"1rem","space-md":"1rem","space-xs":"0.25rem","space-sm":"0.5rem"},fontFamily:{"body-md":["Roboto Flex"],"headline-md":["Roboto Flex"],"label-sm":["Roboto Flex"],"headline-sm":["Roboto Flex"],"title-sm":["Roboto Flex"],"label-lg":["Roboto Flex"],"display-lg":["Roboto Flex"],"title-lg":["Roboto Flex"],"label-md":["Roboto Flex"],"title-md":["Roboto Flex"],"body-lg":["Roboto Flex"],"display-lg-mobile":["Roboto Flex"],"body-sm":["Roboto Flex"],"headline-lg":["Roboto Flex"]},fontSize:{"body-md":["14px",{"lineHeight":"20px","fontWeight":"400"}],"headline-md":["28px",{"lineHeight":"36px","fontWeight":"400"}],"label-sm":["11px",{"lineHeight":"16px","fontWeight":"500"}],"headline-sm":["24px",{"lineHeight":"32px","fontWeight":"400"}],"title-sm":["14px",{"lineHeight":"20px","fontWeight":"500"}],"label-lg":["14px",{"lineHeight":"20px","fontWeight":"500"}],"display-lg":["57px",{"lineHeight":"64px","fontWeight":"400"}],"title-lg":["22px",{"lineHeight":"28px","fontWeight":"400"}],"label-md":["12px",{"lineHeight":"16px","fontWeight":"500"}],"title-md":["16px",{"lineHeight":"24px","fontWeight":"500"}],"body-lg":["16px",{"lineHeight":"24px","fontWeight":"400"}],"display-lg-mobile":["44px",{"lineHeight":"52px","fontWeight":"400"}],"body-sm":["12px",{"lineHeight":"16px","fontWeight":"400"}],"headline-lg":["32px",{"lineHeight":"40px","fontWeight":"400"}]}}}}</script></head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen relative selection:bg-primary-fixed selection:text-on-primary-fixed"><header class="w-full bg-surface pt-safe"><div class="flex justify-between items-center px-6 h-6 text-on-surface select-none"><span class="font-label-md text-label-md font-medium tracking-tight">9:41</span><div class="flex items-center gap-space-xs"><span class="material-symbols-outlined text-[16px]">wifi</span><span class="material-symbols-outlined text-[16px]">signal_cellular_alt</span><span class="material-symbols-outlined text-[16px]">battery_full</span></div></div></header><main class="flex-1 flex flex-col relative w-full pb-16 bg-surface"><div class="flex flex-col w-full px-space-md pb-space-xl"><div class="flex flex-col w-full max-w-md mx-auto px-6 py-4 gap-4"><h1 class="font-title-md text-title-md font-medium text-on-surface">自己紹介カード</h1><div class="flex items-center gap-3 flex-wrap"><div class="w-12 h-12 rounded-full overflow-hidden shrink-0 flex items-center justify-center bg-secondary-container"><img src="https://lh3.googleusercontent.com/aida/AEtjO1Xb84Rlwy0JtFhab-4ZcOm03kGNFsVLvyJXLmC3hsl3jUuXkp37R96s_oyB83oWVn7PurbRMATbY5hsc9WLQGSBVGdtQtnUQK-XmsZpU9ky7YEm3MrOSzR7qov8RngSKNMPhKmbAtEat3S_fyyQO76OTbI_v60N8rLpXwKyUtyWbBcnB8jZU1uULS3E2nR7y0-_NnCzUYyl7TxO49EoPgJHUnRPPK9la4mj1JImFnssof2BOoJsUfq2TwU" alt="プロフィールアイコン" class="w-full h-full object-contain"></div><span id="preview-name" class="font-headline-sm text-headline-sm font-medium text-on-surface">リン</span></div><p id="greeting-display" class="font-body-lg text-body-lg text-on-surface">こんにちは！1年生のリンです。</p><button id="greet-btn" type="button" class="w-full h-10 bg-primary text-on-primary rounded-full font-label-lg text-label-lg active:opacity-90 transition-opacity">あいさつする</button><div class="flex flex-col w-full mt-2"><label for="name-input" class="font-body-md text-body-md text-on-surface mb-1">名前</label><div class="relative w-full flex items-center"><input id="name-input" type="text" value="" placeholder="" aria-describedby="name-error-msg" aria-invalid="true" class="w-full h-12 px-3 rounded bg-surface text-on-surface font-body-lg text-body-lg focus:outline-none shadow-[inset_0_0_0_2px_#ba1a1a]"><div class="absolute right-3 pointer-events-none flex items-center justify-center text-error"><span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">error</span></div></div><div id="name-error-msg" class="mt-1 text-error font-body-sm text-body-sm">名前を入力してください</div></div><div class="flex items-center gap-3 mt-2 w-full"><button id="apply-btn" type="button" class="flex-1 h-10 bg-primary text-on-primary rounded-full font-label-lg text-label-lg active:opacity-90 transition-opacity">名前を反映</button><button id="reset-btn" type="button" class="flex-1 h-10 bg-surface-container-high text-on-surface rounded-full font-label-lg text-label-lg active:bg-surface-container-highest transition-colors">リセット</button></div></div></div>
<script>
  (function() {
    const input = document.getElementById('name-input');
    const errorMsg = document.getElementById('name-error-msg');
    const previewName = document.getElementById('preview-name');
    const greetingDisplay = document.getElementById('greeting-display');
    const applyBtn = document.getElementById('apply-btn');
    const resetBtn = document.getElementById('reset-btn');
    const greetBtn = document.getElementById('greet-btn');

    function setErrorState(show) {
      if (show) {
        input.classList.add('shadow-[inset_0_0_0_2px_#ba1a1a]');
        input.classList.remove('shadow-[inset_0_0_0_1px_#7a7582]');
        if (errorMsg) errorMsg.classList.remove('hidden');
      } else {
        input.classList.remove('shadow-[inset_0_0_0_2px_#ba1a1a]');
        input.classList.add('shadow-[inset_0_0_0_1px_#7a7582]');
        if (errorMsg) errorMsg.classList.add('hidden');
      }
    }

    input.addEventListener('input', function() {
      if (input.value.trim().length > 0) {
        setErrorState(false);
      } else {
        setErrorState(true);
      }
    });

    applyBtn.addEventListener('click', function() {
      const val = input.value.trim();
      if (!val) {
        setErrorState(true);
        input.focus();
      } else {
        setErrorState(false);
        previewName.textContent = val;
        greetingDisplay.textContent = 'こんにちは！1年生の' + val + 'です。';
      }
    });

    resetBtn.addEventListener('click', function() {
      input.value = '';
      setErrorState(true);
      previewName.textContent = 'リン';
      greetingDisplay.textContent = 'こんにちは！1年生のリンです。';
      input.focus();
    });

    greetBtn.addEventListener('click', function() {
      const current = previewName.textContent || 'リン';
      greetingDisplay.textContent = 'やあ！' + current + 'です。よろしくお願いします！';
      setTimeout(function() {
        greetingDisplay.textContent = 'こんにちは！1年生の' + current + 'です。';
      }, 2400);
    });
  })();
</script></main><footer class="fixed bottom-0 w-full z-50 pb-safe bg-surface/80 backdrop-blur-xl pointer-events-none select-none"><div class="h-12 w-full flex items-center justify-center pointer-events-auto"><div class="w-32 h-1 bg-on-surface/30 rounded-full"></div></div></footer>

</body></html>
